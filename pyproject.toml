[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workspace-admin-mcp"
version = "0.1.0"
description = "An admin-oriented Model Context Protocol (MCP) server for Google Workspace directory operations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Anthony DiCicco" }]
keywords = ["mcp", "google-workspace", "admin-sdk", "llm", "claude"]
dependencies = [
  "mcp>=1.2.0",
  "google-api-python-client>=2.100.0",
  "google-auth>=2.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
workspace-admin-mcp = "workspace_admin_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_admin_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
